name: Project 1 — Enterprise Copilot CI

on:
  push:
    paths:
      - "apps/enterprise-copilot/**"
      - "packages/**"
      - "integrations/**"
      - ".github/workflows/copilot-ci.yml"
  pull_request:
    paths:
      - "apps/enterprise-copilot/**"
      - "packages/**"
      - "integrations/**"

jobs:
  test-copilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Copilot Tests & DeepEval
        run: |
          PYTHONPATH=. pytest -v apps/enterprise-copilot/tests/ apps/enterprise-copilot/evaluations/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Copilot Frontend (Cloudflare Pages Verification)
        run: |
          cd apps/enterprise-copilot/frontend
          npm ci || npm install
          npm run build
