events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream copilot_backend {
        server copilot-api:8001;
    }

    upstream qc_backend {
        server qc-api:8002;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Product A - Copilot API
        location /api/copilot/ {
            proxy_pass http://copilot_backend/api/copilot/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Product B - Visual QC API
        location /api/qc/ {
            proxy_pass http://qc_backend/api/qc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Health endpoint
        location /health {
            return 200 '{"status":"gateway_healthy"}';
            add_header Content-Type application/json;
        }
    }
}
