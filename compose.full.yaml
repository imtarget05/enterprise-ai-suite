version: "3.8"

networks:
  full_stack_net:
    driver: bridge

volumes:
  pg_data_full:
  redpanda_data_full:
  rabbitmq_data_full:
  qdrant_data_full:
  minio_data_full:

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-full
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=full_stack_pg_pass
      - POSTGRES_DB=enterprise_suite
    volumes:
      - pg_data_full:/var/lib/postgresql/data
    networks:
      - full_stack_net

  redis:
    image: redis:7-alpine
    container_name: redis-full
    restart: unless-stopped
    networks:
      - full_stack_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-full
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data_full:/var/lib/rabbitmq
    networks:
      - full_stack_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.1
    container_name: redpanda-full
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
    volumes:
      - redpanda_data_full:/var/lib/redpanda/data
    networks:
      - full_stack_net

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant-full
    restart: unless-stopped
    volumes:
      - qdrant_data_full:/qdrant/storage
    networks:
      - full_stack_net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: minio-full
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data_full:/data
    networks:
      - full_stack_net

  copilot-api:
    build:
      context: .
      dockerfile: apps/enterprise-copilot/backend/Dockerfile
    container_name: copilot-api-full
    restart: unless-stopped
    environment:
      - PROFILE=full
      - DATABASE_URL=postgresql://postgres:full_stack_pg_pass@postgres:5432/enterprise_suite
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_ENABLED=true
      - QDRANT_URL=http://qdrant:6333
      - ERPNEXT_USE_SANDBOX=true
      - SALESFORCE_USE_SANDBOX=true
      - LLM_PROVIDER=FREE_TIER
    networks:
      - full_stack_net
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - qdrant

  qc-api:
    build:
      context: .
      dockerfile: apps/visual-quality-gate/backend/Dockerfile
    container_name: qc-api-full
    restart: unless-stopped
    environment:
      - PROFILE=full
      - DATABASE_URL=postgresql://postgres:full_stack_pg_pass@postgres:5432/enterprise_suite
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_ENABLED=true
      - STORAGE_PROVIDER=minio
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - ERPNEXT_USE_SANDBOX=true
    networks:
      - full_stack_net
    depends_on:
      - postgres
      - redpanda
      - minio
